<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1초 WebP 변환기</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; text-align: center; color: #382f2d; background: #fffcf9; padding: 0 16px; }
    .box { border: 2px dashed #d97706; padding: 40px 20px; border-radius: 12px; background: #fffcf7; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .box:hover, .box.dragover { border-color: #b45309; background: #fef3c7; }
    .dl-btn { display: inline-block; background: #d97706; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 6px; margin-top: 16px; font-weight: bold; border: none; font-size: 15px; cursor: pointer; }
    .preview { max-width: 100%; border-radius: 8px; margin-top: 16px; }
    .hint { font-size: 13px; color: #8c7e75; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>🖼️ WebP 이미지 압축기</h3>
  <div class="box" id="dropBox" onclick="document.getElementById('imgInput').click()">
    이미지를 드래그하거나 클릭하세요 (PNG/JPG)
    <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="convert(event.target.files[0])">
  </div>
  <div id="res"></div>

  <script>
    const box = document.getElementById('dropBox');

    box.addEventListener('dragover', (e) => {
      e.preventDefault();
      box.classList.add('dragover');
    });

    box.addEventListener('dragleave', () => {
      box.classList.remove('dragover');
    });

    box.addEventListener('drop', (e) => {
      e.preventDefault();
      box.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) convert(file);
    });

    function convert(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const img = new Image();
      img.onload = () => {
        const cvs = document.createElement('canvas');
        cvs.width = img.width; cvs.height = img.height;
        cvs.getContext('2d').drawImage(img, 0, 0);
        cvs.toBlob(blob => {
          const fileName = `webp_${file.name.split('.')[0]}.webp`;
          const url = URL.createObjectURL(blob);
          const resDiv = document.getElementById('res');
          resDiv.innerHTML = '';

          // 공유 API를 지원하는 모바일(대부분 iOS Safari 포함)에서는
          // '공유/저장' 버튼을 우선 제공 - 사진 앱에 바로 저장 가능
          const webpFile = new File([blob], fileName, { type: 'image/webp' });
          const canShareFile = navigator.canShare && navigator.canShare({ files: [webpFile] });

          if (canShareFile) {
            const shareBtn = document.createElement('button');
            shareBtn.className = 'dl-btn';
            shareBtn.innerText = `📤 저장하기 (${Math.round(blob.size/1024)}KB)`;
            shareBtn.onclick = () => {
              navigator.share({ files: [webpFile], title: fileName }).catch(() => {});
            };
            resDiv.appendChild(shareBtn);
          }

          // 데스크탑/안드로이드용 다운로드 링크 (항상 함께 제공)
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          a.className = 'dl-btn';
          a.style.marginLeft = canShareFile ? '8px' : '0';
          a.innerText = canShareFile ? '⬇️ 다운로드' : `⬇️ 다운로드 (${Math.round(blob.size/1024)}KB)`;
          resDiv.appendChild(a);

          // iOS Safari처럼 위 두 방법이 모두 안 먹는 경우를 위한 최종 안전장치:
          // 변환된 이미지를 화면에 직접 띄워서 길게 눌러 저장할 수 있게 함
          const img2 = document.createElement('img');
          img2.src = url;
          img2.className = 'preview';
          resDiv.appendChild(img2);

          const hint = document.createElement('p');
          hint.className = 'hint';
          hint.innerText = '버튼이 안 눌리면 위 이미지를 길게 눌러 "사진에 저장"을 선택하세요.';
          resDiv.appendChild(hint);
        }, 'image/webp', 0.8);
      };
      img.src = URL.createObjectURL(file);
    }
  </script>
</body>
</html>
